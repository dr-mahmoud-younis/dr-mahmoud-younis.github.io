<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="اللاكتوفيرين: بروتين واحد بثلاثة أسلحة" direction="rtl"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:20px;font-weight:700}.s{font-size:13px;fill:var(--mut)}.m{font-size:14px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>اللاكتوفيرين: بروتين واحد بثلاثة أسلحة</title><rect width="760" height="380" rx="10" style="fill:var(--bg)"/>
<ellipse cx="60" cy="44" rx="26" ry="17" class="card"/><ellipse cx="130" cy="44" rx="26" ry="17" class="card"/><path d="M84 44 h22" fill="none" stroke-width="3" style="stroke:var(--c1)"/><circle cx="52" cy="37" r="5.5" style="fill:var(--c2)"/><circle cx="138" cy="37" r="5.5" style="fill:var(--c2)"/><text x="95" y="76" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">اللاكتوفيرين يحتفظ بالحديد</text>
<text x="430" y="52" class="t" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">اللاكتوفيرين: بروتين واحد بثلاثة أسلحة</text>
<rect x="516" y="90" width="224" height="200" rx="10" class="card"/><rect x="516" y="90" width="224" height="6" rx="3" style="fill:var(--c1)"/><text x="628" y="122" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">يخطف الحديد</text><text x="628" y="143" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">حصر الحديد</text><circle cx="724" cy="172" r="4" style="fill:var(--c1)"/><text x="710" y="177" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">قبضة حديد أقوى 300 مرة</text><circle cx="724" cy="208" r="4" style="fill:var(--c1)"/><text x="710" y="213" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">يحتفظ به حتى حموضة ≈ 3</text><circle cx="724" cy="244" r="4" style="fill:var(--c1)"/><text x="710" y="249" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">تجوع البكتيريا فيتوقف نموها</text>
<rect x="268" y="90" width="224" height="200" rx="10" class="card"/><rect x="268" y="90" width="224" height="6" rx="3" style="fill:var(--c2)"/><text x="380" y="122" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">يصدّ الميكروبات</text><text x="380" y="143" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">فعل مضاد مباشر</text><circle cx="476" cy="172" r="4" style="fill:var(--c2)"/><text x="462" y="177" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">يرتبط بجدار البكتيريا LPS</text><circle cx="476" cy="208" r="4" style="fill:var(--c2)"/><text x="462" y="213" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">يغلق بوابات الهيباران سلفات</text><circle cx="476" cy="244" r="4" style="fill:var(--c2)"/><text x="462" y="249" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">واللاكتوفيرسين يقتل مباشرة</text>
<rect x="20" y="90" width="224" height="200" rx="10" class="card"/><rect x="20" y="90" width="224" height="6" rx="3" style="fill:var(--c3)"/><text x="132" y="122" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">يهدّئ الالتهاب</text><text x="132" y="143" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ضبط مناعي</text><circle cx="228" cy="172" r="4" style="fill:var(--c3)"/><text x="214" y="177" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">يخفض IL-6 و TNF-α</text><circle cx="228" cy="208" r="4" style="fill:var(--c3)"/><text x="214" y="213" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">عبر انتليكتين-1 و LRP1</text><circle cx="228" cy="244" r="4" style="fill:var(--c3)"/><text x="214" y="249" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">من العدلات واللبأ والإفرازات</text>
<text x="380" y="345" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">وعلامة مخبرية: اللاكتوفيرين البرازي (شبيه بالكالكبروتكتين) يتتبع التهاب الأمعاء</text>
</svg>
