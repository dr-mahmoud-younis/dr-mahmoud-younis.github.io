<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img" aria-label="ثلاثة مفاهيم وراء «فشل الإنسولين»" direction="rtl"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:19px;font-weight:700}.s{font-size:14px;fill:var(--mut)}.m{font-size:15px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>ثلاثة مفاهيم وراء «فشل الإنسولين»</title><rect width="760" height="395" fill="var(--bg)" rx="10"/><path d="M270 58 v10 h460 v-10" fill="none" stroke="var(--c1)" stroke-width="2.5"/><text x="500.0" y="46" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مقاومة ظاهرية</text><path d="M30 58 v10 h220 v-10" fill="none" stroke="var(--c3)" stroke-width="2.5"/><text x="140" y="46" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مقاومة حقيقية</text><rect x="510" y="78" width="220" height="250" rx="10" class="card"/><rect x="510" y="78" width="220" height="6" rx="3" fill="var(--c1)"/><text x="620" y="112" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">فشل توصيل الإنسولين</text><text x="620" y="136" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الجرعة لا تصل كاملة</text><circle cx="714" cy="167" r="4" fill="var(--c1)"/><text x="702" y="172" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">عدم تجهيز القلم (Priming)</text><circle cx="714" cy="211" r="4" fill="var(--c1)"/><text x="702" y="216" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">سحب الإبرة مبكرًا</text><circle cx="714" cy="255" r="4" fill="var(--c1)"/><text x="702" y="260" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">إعادة استخدام الإبر</text><rect x="270" y="78" width="220" height="250" rx="10" class="card"/><rect x="270" y="78" width="220" height="6" rx="3" fill="var(--c1)"/><text x="380" y="112" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">اضطراب الامتصاص</text><text x="380" y="136" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">يصل ببطء أو بلا انتظام</text><circle cx="474" cy="167" r="4" fill="var(--c1)"/><text x="462" y="172" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">Lipohypertrophy</text><circle cx="474" cy="211" r="4" fill="var(--c1)"/><text x="462" y="216" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">سوء التخزين (حرارة/تجميد)</text><circle cx="474" cy="255" r="4" fill="var(--c1)"/><text x="462" y="260" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">تجاوز مدة الاستخدام</text><rect x="30" y="78" width="220" height="250" rx="10" class="card"/><rect x="30" y="78" width="220" height="6" rx="3" fill="var(--c3)"/><text x="140" y="112" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مقاومة الإنسولين الحقيقية</text><text x="140" y="136" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الأنسجة تستجيب بضعف</text><circle cx="234" cy="167" r="4" fill="var(--c3)"/><text x="222" y="172" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">العدوى والالتهابات</text><circle cx="234" cy="211" r="4" fill="var(--c3)"/><text x="222" y="216" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">الكورتيزون</text><circle cx="234" cy="255" r="4" fill="var(--c3)"/><text x="222" y="260" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">التوتر والنوم والدهون الحشوية</text><circle cx="234" cy="299" r="4" fill="var(--c3)"/><text x="222" y="304" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">كوشينج وضخامة الأطراف</text><text x="380.0" y="368" class="h" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">قبل زيادة الجرعة: تأكد أن الجرعة تصل وتُمتص.</text></svg>