<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img" aria-label="Three concepts behind “insulin failure”"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:19px;font-weight:700}.s{font-size:14px;fill:var(--mut)}.m{font-size:15px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>Three concepts behind “insulin failure”</title><rect width="760" height="395" fill="var(--bg)" rx="10"/><path d="M30 58 v10 h460 v-10" fill="none" stroke="var(--c1)" stroke-width="2.5"/><text x="260.0" y="46" class="h" text-anchor="middle">Apparent resistance</text><path d="M510 58 v10 h220 v-10" fill="none" stroke="var(--c3)" stroke-width="2.5"/><text x="620" y="46" class="h" text-anchor="middle">True resistance</text><rect x="30" y="78" width="220" height="250" rx="10" class="card"/><rect x="30" y="78" width="220" height="6" rx="3" fill="var(--c1)"/><text x="140" y="112" class="h" text-anchor="middle">Failure of delivery</text><text x="140" y="136" class="s" text-anchor="middle">The dose does not fully arrive</text><circle cx="46" cy="167" r="4" fill="var(--c1)"/><text x="60" y="172" class="m" text-anchor="start">Pen not primed</text><circle cx="46" cy="211" r="4" fill="var(--c1)"/><text x="60" y="216" class="m" text-anchor="start">Needle removed too early</text><circle cx="46" cy="255" r="4" fill="var(--c1)"/><text x="60" y="260" class="m" text-anchor="start">Needles reused</text><rect x="270" y="78" width="220" height="250" rx="10" class="card"/><rect x="270" y="78" width="220" height="6" rx="3" fill="var(--c1)"/><text x="380" y="112" class="h" text-anchor="middle">Disordered absorption</text><text x="380" y="136" class="s" text-anchor="middle">Slow or erratic uptake</text><circle cx="286" cy="167" r="4" fill="var(--c1)"/><text x="300" y="172" class="m" text-anchor="start">Lipohypertrophy</text><circle cx="286" cy="211" r="4" fill="var(--c1)"/><text x="300" y="216" class="m" text-anchor="start">Poor storage (heat/freezing)</text><circle cx="286" cy="255" r="4" fill="var(--c1)"/><text x="300" y="260" class="m" text-anchor="start">Past in-use period</text><rect x="510" y="78" width="220" height="250" rx="10" class="card"/><rect x="510" y="78" width="220" height="6" rx="3" fill="var(--c3)"/><text x="620" y="112" class="h" text-anchor="middle">True insulin resistance</text><text x="620" y="136" class="s" text-anchor="middle">Tissues respond poorly</text><circle cx="526" cy="167" r="4" fill="var(--c3)"/><text x="540" y="172" class="m" text-anchor="start">Infection and inflammation</text><circle cx="526" cy="211" r="4" fill="var(--c3)"/><text x="540" y="216" class="m" text-anchor="start">Glucocorticoids</text><circle cx="526" cy="255" r="4" fill="var(--c3)"/><text x="540" y="260" class="m" text-anchor="start">Stress, sleep, visceral fat</text><circle cx="526" cy="299" r="4" fill="var(--c3)"/><text x="540" y="304" class="m" text-anchor="start">Cushing, acromegaly</text><text x="380.0" y="368" class="h" text-anchor="middle">Before raising the dose: make sure it arrives and is absorbed.</text></svg>