<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="ماذا تخبرنا العلامات الجلدية؟" direction="rtl"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:19px;font-weight:700}.s{font-size:14px;fill:var(--mut)}.m{font-size:15px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>ماذا تخبرنا العلامات الجلدية؟</title><rect width="760" height="432" fill="var(--bg)" rx="10"/><text x="380.0" y="34" class="t" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ماذا تخبرنا العلامات الجلدية؟</text><text x="730" y="66" class="s" text-anchor="start" direction="rtl" unicode-bidi="plaintext">العلامة الجلدية</text><text x="420" y="66" class="s" text-anchor="start" direction="rtl" unicode-bidi="plaintext">الدلالة المحتملة</text><rect x="30" y="80" width="700" height="44" rx="8" class="card"/><rect x="724" y="80" width="6" height="44" rx="3" fill="var(--c1)"/><text x="710" y="108" class="h" text-anchor="start" direction="rtl" unicode-bidi="plaintext">Acanthosis Nigricans</text><text x="420" y="108" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">مقاومة الإنسولين وفرط الإنسولين</text><rect x="30" y="132" width="700" height="44" rx="8" class="card"/><rect x="724" y="132" width="6" height="44" rx="3" fill="var(--c3)"/><text x="710" y="160" class="h" text-anchor="start" direction="rtl" unicode-bidi="plaintext">Eruptive Xanthomas</text><text x="420" y="160" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">ارتفاع شديد في الدهون الثلاثية: قِس TG عاجلًا</text><rect x="30" y="184" width="700" height="44" rx="8" class="card"/><rect x="724" y="184" width="6" height="44" rx="3" fill="var(--c2)"/><text x="710" y="212" class="h" text-anchor="start" direction="rtl" unicode-bidi="plaintext">Xerosis (جفاف الجلد)</text><text x="420" y="212" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">احتمال اعتلال عصبي لاإرادي</text><rect x="30" y="236" width="700" height="44" rx="8" class="card"/><rect x="724" y="236" width="6" height="44" rx="3" fill="var(--c1)"/><text x="710" y="264" class="h" text-anchor="start" direction="rtl" unicode-bidi="plaintext">Cheiroarthropathy</text><text x="420" y="264" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">تغيّر الكولاجين والأنسجة الضامة</text><rect x="30" y="288" width="700" height="44" rx="8" class="card"/><rect x="724" y="288" width="6" height="44" rx="3" fill="var(--c2)"/><text x="710" y="316" class="h" text-anchor="start" direction="rtl" unicode-bidi="plaintext">Lipohypertrophy</text><text x="420" y="316" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">اضطراب امتصاص الإنسولين</text><rect x="30" y="340" width="700" height="44" rx="8" class="card"/><rect x="724" y="340" width="6" height="44" rx="3" fill="var(--c3)"/><text x="710" y="368" class="h" text-anchor="start" direction="rtl" unicode-bidi="plaintext">تكرار العدوى الفطرية</text><text x="420" y="368" class="m" text-anchor="start" direction="rtl" unicode-bidi="plaintext">ارتفاع السكر وعوامل مهيّئة</text><text x="380.0" y="416" class="s" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تُوجّه التقييم، ولا تثبت مضاعفة بمفردها.</text></svg>