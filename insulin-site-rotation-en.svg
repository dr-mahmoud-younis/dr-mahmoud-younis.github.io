<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Insulin injection site rotation"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:19px;font-weight:700}.s{font-size:14px;fill:var(--mut)}.m{font-size:15px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>Insulin injection site rotation</title><rect width="760" height="380" fill="var(--bg)" rx="10"/><text x="380.0" y="34" class="t" text-anchor="middle">Rotate within and between areas</text><rect x="30" y="60" width="170" height="135" rx="10" class="card"/><text x="115" y="84" class="h" text-anchor="middle">Abdomen</text><rect x="65" y="100" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="89" y="126" class="s" text-anchor="middle">1</text><rect x="117" y="100" width="48" height="40" rx="6" fill="var(--c3)" fill-opacity=".35" stroke="var(--c1)" stroke-width="1.8"/><text x="141" y="126" class="s" text-anchor="middle">2</text><rect x="65" y="144" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="89" y="170" class="s" text-anchor="middle">3</text><rect x="117" y="144" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="141" y="170" class="s" text-anchor="middle">4</text><rect x="220" y="60" width="170" height="135" rx="10" class="card"/><text x="305" y="84" class="h" text-anchor="middle">Thighs</text><rect x="255" y="100" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="279" y="126" class="s" text-anchor="middle">1</text><rect x="307" y="100" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="331" y="126" class="s" text-anchor="middle">2</text><rect x="255" y="144" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="279" y="170" class="s" text-anchor="middle">3</text><rect x="307" y="144" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="331" y="170" class="s" text-anchor="middle">4</text><rect x="30" y="210" width="170" height="135" rx="10" class="card"/><text x="115" y="234" class="h" text-anchor="middle">Arms</text><rect x="65" y="250" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="89" y="276" class="s" text-anchor="middle">1</text><rect x="117" y="250" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="141" y="276" class="s" text-anchor="middle">2</text><rect x="65" y="294" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="89" y="320" class="s" text-anchor="middle">3</text><rect x="117" y="294" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="141" y="320" class="s" text-anchor="middle">4</text><rect x="220" y="210" width="170" height="135" rx="10" class="card"/><text x="305" y="234" class="h" text-anchor="middle">Buttocks</text><rect x="255" y="250" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="279" y="276" class="s" text-anchor="middle">1</text><rect x="307" y="250" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="331" y="276" class="s" text-anchor="middle">2</text><rect x="255" y="294" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="279" y="320" class="s" text-anchor="middle">3</text><rect x="307" y="294" width="48" height="40" rx="6" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="331" y="320" class="s" text-anchor="middle">4</text><rect x="410" y="60" width="320" height="285" rx="10" class="card"/><rect x="426" y="82" width="22" height="16" rx="4" fill="var(--c3)" fill-opacity=".35" stroke="var(--c1)" stroke-width="1.8"/><text x="456" y="95" class="m" text-anchor="start">Lipohypertrophy: do not inject</text><rect x="426" y="112" width="22" height="16" rx="4" fill="none" stroke="var(--c1)" stroke-width="1.8"/><text x="456" y="125" class="m" text-anchor="start">Healthy tissue</text><text x="426" y="166" class="h" text-anchor="start">Leave a gap from the last injection</text><circle cx="430" cy="201" r="4" fill="var(--c2)"/><text x="444" y="206" class="m" text-anchor="start">Inspect and palpate sites</text><circle cx="430" cy="241" r="4" fill="var(--c2)"/><text x="444" y="246" class="m" text-anchor="start">Avoid lumps and firm areas</text><circle cx="430" cy="281" r="4" fill="var(--c2)"/><text x="444" y="286" class="m" text-anchor="start">After a site change: review the dose</text></svg>