<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="Lactoferrin: one protein, three roles"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:20px;font-weight:700}.s{font-size:13px;fill:var(--mut)}.m{font-size:14px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>Lactoferrin: one protein, three roles</title><rect width="760" height="380" rx="10" style="fill:var(--bg)"/>
<ellipse cx="630" cy="44" rx="26" ry="17" class="card"/><ellipse cx="700" cy="44" rx="26" ry="17" class="card"/><path d="M654 44 h22" fill="none" stroke-width="3" style="stroke:var(--c1)"/><circle cx="622" cy="37" r="5.5" style="fill:var(--c2)"/><circle cx="708" cy="37" r="5.5" style="fill:var(--c2)"/><text x="665" y="76" class="s" text-anchor="middle">lactoferrin holds iron</text>
<text x="340" y="52" class="t" text-anchor="middle">Lactoferrin: one protein, three roles</text>
<rect x="20" y="90" width="224" height="200" rx="10" class="card"/><rect x="20" y="90" width="224" height="6" rx="3" style="fill:var(--c1)"/><text x="132" y="122" class="h" text-anchor="middle">Steals iron</text><text x="132" y="143" class="s" text-anchor="middle">Iron sequestration</text><circle cx="40" cy="172" r="4" style="fill:var(--c1)"/><text x="54" y="177" class="m">Grips iron 300× transferrin</text><circle cx="40" cy="208" r="4" style="fill:var(--c1)"/><text x="54" y="213" class="m">Holds iron even at pH ≈ 3</text><circle cx="40" cy="244" r="4" style="fill:var(--c1)"/><text x="54" y="249" class="m">Bacteria starve, growth halts</text>
<rect x="268" y="90" width="224" height="200" rx="10" class="card"/><rect x="268" y="90" width="224" height="6" rx="3" style="fill:var(--c2)"/><text x="380" y="122" class="h" text-anchor="middle">Fights microbes</text><text x="380" y="143" class="s" text-anchor="middle">Direct antimicrobial action</text><circle cx="288" cy="172" r="4" style="fill:var(--c2)"/><text x="302" y="177" class="m">Binds LPS of bacterial walls</text><circle cx="288" cy="208" r="4" style="fill:var(--c2)"/><text x="302" y="213" class="m">Blocks heparan-sulfate gates</text><circle cx="288" cy="244" r="4" style="fill:var(--c2)"/><text x="302" y="249" class="m">Lactoferricin kills directly</text>
<rect x="516" y="90" width="224" height="200" rx="10" class="card"/><rect x="516" y="90" width="224" height="6" rx="3" style="fill:var(--c3)"/><text x="628" y="122" class="h" text-anchor="middle">Calms inflammation</text><text x="628" y="143" class="s" text-anchor="middle">Immune regulation</text><circle cx="536" cy="172" r="4" style="fill:var(--c3)"/><text x="550" y="177" class="m">Lowers IL-6 and TNF-α</text><circle cx="536" cy="208" r="4" style="fill:var(--c3)"/><text x="550" y="213" class="m">Via intelectin-1 and LRP1</text><circle cx="536" cy="244" r="4" style="fill:var(--c3)"/><text x="550" y="249" class="m">From neutrophils &amp; secretions</text>
<text x="380" y="345" class="h" text-anchor="middle">Lab marker too: fecal lactoferrin (like calprotectin) tracks gut inflammation</text>
</svg>
