<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-label="What do skin signs tell us?"><style>
svg{--bg:#f7f5f0;--ink:#12303a;--mut:#4d6169;--gold:#9a7a2e;--line:#d9d3c3;--c1:#2f7d8c;--c2:#9a7a2e;--c3:#a64b3c;--card:#fffdf8}
@media(prefers-color-scheme:dark){svg{--bg:#0e1d23;--ink:#eae6da;--mut:#a5b4b9;--gold:#d3ae55;--line:#2a4048;--c1:#5fb3c3;--c2:#d3ae55;--c3:#e08a7a;--card:#14272e}}
text{font-family:Cairo,Tahoma,"DejaVu Sans",Arial,sans-serif;fill:var(--ink)}
.t{font-size:19px;font-weight:700}.s{font-size:14px;fill:var(--mut)}.m{font-size:15px}.h{font-size:16px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
</style><title>What do skin signs tell us?</title><rect width="760" height="432" rx="10" style="fill:var(--bg)"/><text x="380.0" y="34" class="t" text-anchor="middle">What do skin signs tell us?</text><text x="30" y="66" class="s" text-anchor="start">Skin sign</text><text x="330" y="66" class="s" text-anchor="start">Possible significance</text><rect x="30" y="80" width="700" height="44" rx="8" class="card"/><rect x="30" y="80" width="6" height="44" rx="3" style="fill:var(--c1)"/><text x="46" y="108" class="h" text-anchor="start">Acanthosis nigricans</text><text x="330" y="108" class="m" text-anchor="start">Insulin resistance, hyperinsulinaemia</text><rect x="30" y="132" width="700" height="44" rx="8" class="card"/><rect x="30" y="132" width="6" height="44" rx="3" style="fill:var(--c3)"/><text x="46" y="160" class="h" text-anchor="start">Eruptive xanthomas</text><text x="330" y="160" class="m" text-anchor="start">Severe hypertriglyceridaemia: check TG urgently</text><rect x="30" y="184" width="700" height="44" rx="8" class="card"/><rect x="30" y="184" width="6" height="44" rx="3" style="fill:var(--c2)"/><text x="46" y="212" class="h" text-anchor="start">Xerosis (dry skin)</text><text x="330" y="212" class="m" text-anchor="start">Possible autonomic neuropathy</text><rect x="30" y="236" width="700" height="44" rx="8" class="card"/><rect x="30" y="236" width="6" height="44" rx="3" style="fill:var(--c1)"/><text x="46" y="264" class="h" text-anchor="start">Cheiroarthropathy</text><text x="330" y="264" class="m" text-anchor="start">Collagen and connective tissue change</text><rect x="30" y="288" width="700" height="44" rx="8" class="card"/><rect x="30" y="288" width="6" height="44" rx="3" style="fill:var(--c2)"/><text x="46" y="316" class="h" text-anchor="start">Lipohypertrophy</text><text x="330" y="316" class="m" text-anchor="start">Impaired insulin absorption</text><rect x="30" y="340" width="700" height="44" rx="8" class="card"/><rect x="30" y="340" width="6" height="44" rx="3" style="fill:var(--c3)"/><text x="46" y="368" class="h" text-anchor="start">Recurrent fungal infection</text><text x="330" y="368" class="m" text-anchor="start">Hyperglycaemia and predisposing factors</text><text x="380.0" y="416" class="s" text-anchor="middle">They guide assessment; they do not prove a complication on their own.</text></svg>